<!-- Main Content Canvas -->

<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">PharmaCare Admin</h1>

<!-- Form -->
<form action="tableaudebordpharmacy.html" class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Adresse Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-md text-body-md placeholder:text-outline/60" id="email" name="email" placeholder="nom@pharmacie.ci" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Mot de passe</label>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" href="#">Oublié ?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-11 pr-11 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-md text-body-md placeholder:text-outline/60" id="password" name="password" placeholder="•••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors flex items-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-sm mt-base">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember" type="checkbox" title="Rester connecté" placeholder="Remember"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Rester connecté</label>
</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-title-lg text-title-lg py-4 rounded-lg shadow-sm hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-md" type="submit">
<span>Se connecter</span>

<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Micro-interaction for submit button
        document.querySelector('form').addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span><span>Connexion...</span>`;
            
            // Artificial delay to show state
            setTimeout(() => {
                // In a real app, this would redirect or show error
                console.log('Login attempt simulated');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 2000);
        });
    </script>
