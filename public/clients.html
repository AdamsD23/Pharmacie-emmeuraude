<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clients | Pharmacie Émeraude</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800">
<main id="app-main" class="min-h-screen">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Clients</h1>
                <p class="text-slate-500" id="summary">Chargement…</p>
            </div>
            <div class="flex gap-2">
                <button type="button" id="export" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 font-medium">
                    <span class="material-symbols-outlined">download</span><span class="hidden sm:inline">Exporter</span>
                </button>
                <button type="button" id="add" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-brand-700 hover:bg-brand-800 text-white font-semibold">
                    <span class="material-symbols-outlined">person_add</span>Nouveau client
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-3">
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                <input id="search" type="search" placeholder="Rechercher par nom, téléphone ou email…" class="w-full pl-10 pr-3 py-2.5 rounded-lg border border-slate-200 focus:border-brand-600 focus:ring-2 focus:ring-brand-100 outline-none">
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div class="table-wrap">
                <table class="w-full text-sm">
                    <thead class="text-left text-slate-500 bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="px-4 py-3 font-medium">Client</th>
                            <th class="px-4 py-3 font-medium">Contact</th>
                            <th class="px-4 py-3 font-medium text-center">Achats</th>
                            <th class="px-4 py-3 font-medium text-right">Total dépensé</th>
                            <th class="px-4 py-3 font-medium">Dernier achat</th>
                            <th class="px-4 py-3 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rows" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="assets/app.js"></script>
<script>
    let clients = [];
    let query = '';

    const FIELDS = [
        { name: 'nom', label: 'Nom', required: true, autofocus: true },
        { name: 'prenom', label: 'Prénom' },
        { name: 'telephone', label: 'Téléphone', type: 'tel', placeholder: '07 00 00 00 00' },
        { name: 'email', label: 'Email', type: 'email' },
        { name: 'adresse', label: 'Adresse', full: true, placeholder: 'Commune, quartier' }
    ];

    const fullName = c => `${c.nom} ${c.prenom || ''}`.trim();

    function render() {
        const canDelete = App.can('pharmacien');
        document.getElementById('summary').textContent = `${clients.length} client(s)`;
        document.getElementById('rows').innerHTML = clients.length ? clients.map(c => `
            <tr class="hover:bg-slate-50 cursor-pointer" data-open="${c.id}">
                <td class="px-4 py-3">
                    <div class="flex items-center gap-3">
                        <span class="w-9 h-9 rounded-full bg-brand-50 text-brand-700 text-xs font-bold flex items-center justify-center">${App.esc((c.nom[0] || '') + (c.prenom?.[0] || '')).toUpperCase()}</span>
                        <div><p class="font-medium text-slate-900">${App.esc(fullName(c))}</p><p class="text-xs text-slate-500">${App.esc(c.adresse || '')}</p></div>
                    </div>
                </td>
                <td class="px-4 py-3"><p>${App.esc(c.telephone || '—')}</p><p class="text-xs text-slate-500">${App.esc(c.email || '')}</p></td>
                <td class="px-4 py-3 text-center">${c.nb_achats}</td>
                <td class="px-4 py-3 text-right font-semibold whitespace-nowrap">${App.fcfa(c.total_achats)}</td>
                <td class="px-4 py-3 text-slate-500 whitespace-nowrap">${c.dernier_achat ? App.date(c.dernier_achat) : '—'}</td>
                <td class="px-4 py-3 text-right whitespace-nowrap">
                    ${c.telephone ? `<a href="https://wa.me/${c.telephone.replace(/\D/g, '').replace(/^0/, '2250')}" target="_blank" rel="noopener" class="inline-flex w-9 h-9 items-center justify-center rounded-lg hover:bg-emerald-50 text-emerald-700" aria-label="WhatsApp" title="Écrire sur WhatsApp"><span class="material-symbols-outlined">chat</span></a>` : ''}
                    <button type="button" data-edit="${c.id}" class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-600" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>
                    ${canDelete ? `<button type="button" data-delete="${c.id}" class="w-9 h-9 rounded-lg hover:bg-red-50 text-red-600" aria-label="Supprimer"><span class="material-symbols-outlined">delete</span></button>` : ''}
                </td>
            </tr>`).join('') : App.emptyRow(6, query ? 'Aucun client ne correspond.' : 'Aucun client enregistré pour le moment.');
    }

    async function load() {
        clients = await App.api(`/clients${query ? '?q=' + encodeURIComponent(query) : ''}`);
        render();
    }

    function openForm(client) {
        App.formModal({
            title: client ? 'Modifier le client' : 'Nouveau client',
            fields: FIELDS,
            values: client,
            onSubmit: async data => {
                if (client) await App.api(`/clients/${client.id}`, { method: 'PUT', body: data });
                else await App.api('/clients', { method: 'POST', body: data });
                App.toast(client ? 'Client modifié' : 'Client ajouté');
                await load();
            }
        });
    }

    async function openDetail(id) {
        const c = await App.api(`/clients/${id}`);
        App.modal({
            title: fullName(c),
            size: 'max-w-xl',
            content: `
                <div class="grid grid-cols-3 gap-3 mb-5">
                    <div class="rounded-xl bg-slate-50 p-3"><p class="text-xs text-slate-500">Achats</p><p class="text-lg font-bold">${c.nb_achats}</p></div>
                    <div class="rounded-xl bg-slate-50 p-3"><p class="text-xs text-slate-500">Total</p><p class="text-lg font-bold">${App.fcfa(c.total_achats)}</p></div>
                    <div class="rounded-xl bg-slate-50 p-3"><p class="text-xs text-slate-500">Client depuis</p><p class="text-lg font-bold">${App.date(c.created_at)}</p></div>
                </div>
                <p class="text-sm text-slate-600 mb-4">${[c.telephone, c.email, c.adresse].filter(Boolean).map(App.esc).join(' · ') || 'Aucune coordonnée'}</p>
                <h3 class="font-semibold mb-2">Historique d'achats</h3>
                <ul class="divide-y divide-slate-100 border-y border-slate-100 text-sm">
                    ${c.achats.length ? c.achats.map(a => `
                        <li><a href="ventes.html?id=${a.id}" class="flex justify-between gap-3 py-2 hover:bg-slate-50 px-1">
                            <span>#${a.id} · ${App.datetime(a.date)} · ${a.nb_articles} produit(s)</span>
                            <span class="font-medium ${a.statut === 'annulee' ? 'line-through text-slate-400' : ''}">${App.fcfa(a.total)}</span>
                        </a></li>`).join('') : '<li class="py-4 text-center text-slate-500">Aucun achat enregistré.</li>'}
                </ul>`
        });
    }

    App.ready(async () => {
        document.getElementById('search').addEventListener('input', App.debounce(e => { query = e.target.value.trim(); load(); }));
        document.getElementById('add').addEventListener('click', () => openForm(null));
        document.getElementById('export').addEventListener('click', () => App.csv(`clients-${App.today()}.csv`, clients, [
            { label: 'Nom', value: 'nom' }, { label: 'Prénom', value: 'prenom' },
            { label: 'Téléphone', value: 'telephone' }, { label: 'Email', value: 'email' }, { label: 'Adresse', value: 'adresse' },
            { label: 'Nombre d\'achats', value: 'nb_achats' }, { label: 'Total (FCFA)', value: 'total_achats' }
        ]));

        document.getElementById('rows').addEventListener('click', async e => {
            if (e.target.closest('a')) return;
            const edit = e.target.closest('[data-edit]');
            const del = e.target.closest('[data-delete]');
            const row = e.target.closest('[data-open]');
            try {
                if (edit) return openForm(clients.find(c => c.id === Number(edit.dataset.edit)));
                if (del) {
                    const c = clients.find(x => x.id === Number(del.dataset.delete));
                    if (await App.confirm(`Supprimer ${fullName(c)} ? Ses ventes resteront dans l'historique.`, { danger: true, confirmLabel: 'Supprimer' })) {
                        await App.api(`/clients/${c.id}`, { method: 'DELETE' });
                        App.toast('Client supprimé');
                        load();
                    }
                    return;
                }
                if (row) await openDetail(row.dataset.open);
            } catch (error) {
                App.toast(error.message, 'error');
            }
        });

        document.getElementById('rows').innerHTML = App.skeletonRows(6);
        await load();
    });
</script>
</body>
</html>
