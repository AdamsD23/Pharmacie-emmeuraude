<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fournisseurs | Pharmacie Émeraude</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-roles="pharmacien">
<main id="app-main" class="min-h-screen">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Fournisseurs</h1>
                <p class="text-slate-500">Vos grossistes et laboratoires.</p>
            </div>
            <button type="button" id="add" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-brand-700 hover:bg-brand-800 text-white font-semibold">
                <span class="material-symbols-outlined">add_business</span>Nouveau fournisseur
            </button>
        </div>

        <div id="cards" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
            <div class="skeleton h-44"></div><div class="skeleton h-44"></div><div class="skeleton h-44"></div>
        </div>
    </div>
</main>

<script src="assets/app.js"></script>
<script>
    let suppliers = [];

    const FIELDS = [
        { name: 'nom', label: 'Nom', required: true, full: true, autofocus: true, placeholder: 'Ex : Laborex Côte d\'Ivoire' },
        { name: 'telephone', label: 'Téléphone', type: 'tel' },
        { name: 'email', label: 'Email', type: 'email' },
        { name: 'adresse', label: 'Adresse', full: true }
    ];

    function render() {
        document.getElementById('cards').innerHTML = suppliers.length ? suppliers.map(f => `
            <article class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col">
                <div class="flex items-start justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                        <span class="w-11 h-11 rounded-xl bg-sky-50 text-sky-700 flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined">local_shipping</span></span>
                        <h2 class="font-semibold text-slate-900 leading-tight">${App.esc(f.nom)}</h2>
                    </div>
                    <div class="flex flex-shrink-0">
                        <button type="button" data-edit="${f.id}" class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-600" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>
                        <button type="button" data-delete="${f.id}" class="w-9 h-9 rounded-lg hover:bg-red-50 text-red-600" aria-label="Supprimer"><span class="material-symbols-outlined">delete</span></button>
                    </div>
                </div>
                <ul class="mt-4 space-y-1.5 text-sm text-slate-600 flex-1">
                    ${f.telephone ? `<li class="flex items-center gap-2"><span class="material-symbols-outlined text-slate-400" style="font-size:18px">call</span><a href="tel:${App.esc(f.telephone)}" class="hover:text-brand-700">${App.esc(f.telephone)}</a></li>` : ''}
                    ${f.email ? `<li class="flex items-center gap-2"><span class="material-symbols-outlined text-slate-400" style="font-size:18px">mail</span><a href="mailto:${App.esc(f.email)}" class="hover:text-brand-700 truncate">${App.esc(f.email)}</a></li>` : ''}
                    ${f.adresse ? `<li class="flex items-center gap-2"><span class="material-symbols-outlined text-slate-400" style="font-size:18px">location_on</span>${App.esc(f.adresse)}</li>` : ''}
                </ul>
                <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-100 text-sm">
                    <a href="stock.html" class="rounded-lg bg-slate-50 px-3 py-2 hover:bg-slate-100"><span class="block font-semibold">${f.nb_produits}</span><span class="text-slate-500">produit(s)</span></a>
                    <a href="commandes.html" class="rounded-lg bg-slate-50 px-3 py-2 hover:bg-slate-100"><span class="block font-semibold">${f.nb_commandes}</span><span class="text-slate-500">commande(s)</span></a>
                </div>
            </article>`).join('')
            : '<p class="col-span-full text-center text-slate-500 py-16">Aucun fournisseur. Ajoutez votre premier grossiste.</p>';
    }

    async function load() {
        suppliers = await App.api('/suppliers');
        render();
    }

    function openForm(supplier) {
        App.formModal({
            title: supplier ? 'Modifier le fournisseur' : 'Nouveau fournisseur',
            fields: FIELDS,
            values: supplier,
            onSubmit: async data => {
                if (supplier) await App.api(`/suppliers/${supplier.id}`, { method: 'PUT', body: data });
                else await App.api('/suppliers', { method: 'POST', body: data });
                App.toast(supplier ? 'Fournisseur modifié' : 'Fournisseur ajouté');
                await load();
            }
        });
    }

    App.ready(async () => {
        document.getElementById('add').addEventListener('click', () => openForm(null));
        document.getElementById('cards').addEventListener('click', async e => {
            const edit = e.target.closest('[data-edit]');
            const del = e.target.closest('[data-delete]');
            try {
                if (edit) openForm(suppliers.find(f => f.id === Number(edit.dataset.edit)));
                if (del) {
                    const f = suppliers.find(x => x.id === Number(del.dataset.delete));
                    if (await App.confirm(`Supprimer « ${f.nom} » ?`, { danger: true, confirmLabel: 'Supprimer' })) {
                        await App.api(`/suppliers/${f.id}`, { method: 'DELETE' });
                        App.toast('Fournisseur supprimé');
                        load();
                    }
                }
            } catch (error) {
                App.toast(error.message, 'error');
            }
        });
        await load();
    });
</script>
</body>
</html>
