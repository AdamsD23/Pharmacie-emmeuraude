<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tableau de bord | Pharmacie Émeraude</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800">
<main id="app-main" class="min-h-screen">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900" id="greeting">Tableau de bord</h1>
                <p class="text-slate-500" id="today-label"></p>
            </div>
            <a href="caisse.html" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-brand-700 hover:bg-brand-800 text-white font-semibold">
                <span class="material-symbols-outlined">add_shopping_cart</span>Nouvelle vente
            </a>
        </div>

        <!-- Indicateurs -->
        <section id="kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div>
        </section>

        <div class="grid lg:grid-cols-3 gap-6">
            <!-- Graphique -->
            <section class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5">
                <div class="flex items-center justify-between gap-4 mb-4">
                    <div>
                        <h2 class="font-semibold text-slate-900">Chiffre d'affaires</h2>
                        <p class="text-sm text-slate-500" id="chart-total"></p>
                    </div>
                    <div class="flex rounded-lg border border-slate-200 p-0.5 text-sm" role="group" aria-label="Période">
                        <button type="button" data-days="7" class="px-3 py-1 rounded-md bg-brand-700 text-white font-medium">7 jours</button>
                        <button type="button" data-days="30" class="px-3 py-1 rounded-md text-slate-600 font-medium">30 jours</button>
                    </div>
                </div>
                <div id="chart" class="h-56 flex items-end gap-1 sm:gap-2"></div>
                <div id="chart-labels" class="flex gap-1 sm:gap-2 mt-2 text-[11px] text-slate-500"></div>
            </section>

            <!-- Alertes -->
            <section class="bg-white rounded-2xl border border-slate-200 p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-slate-900">Alertes stock</h2>
                    <a href="stock.html?alerte=stock" class="text-sm text-brand-700 font-medium hover:underline">Tout voir</a>
                </div>
                <ul id="alerts" class="space-y-2"></ul>
            </section>
        </div>

        <div class="grid lg:grid-cols-3 gap-6">
            <!-- Dernières ventes -->
            <section class="lg:col-span-2 bg-white rounded-2xl border border-slate-200">
                <div class="flex items-center justify-between p-5 pb-3">
                    <h2 class="font-semibold text-slate-900">Dernières ventes</h2>
                    <a href="ventes.html" class="text-sm text-brand-700 font-medium hover:underline">Historique</a>
                </div>
                <div class="table-wrap">
                    <table class="w-full text-sm">
                        <thead class="text-left text-slate-500 border-y border-slate-100 bg-slate-50/60">
                            <tr><th class="px-5 py-2 font-medium">N°</th><th class="px-5 py-2 font-medium">Date</th><th class="px-5 py-2 font-medium">Client</th><th class="px-5 py-2 font-medium">Paiement</th><th class="px-5 py-2 font-medium text-right">Total</th></tr>
                        </thead>
                        <tbody id="recent-sales" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </section>

            <!-- Meilleures ventes -->
            <section class="bg-white rounded-2xl border border-slate-200 p-5">
                <h2 class="font-semibold text-slate-900 mb-4">Top produits <span class="text-slate-400 font-normal text-sm">(30 jours)</span></h2>
                <ol id="top-products" class="space-y-3"></ol>
            </section>
        </div>
    </div>
</main>

<script src="assets/app.js"></script>
<script>
    function kpi(icon, color, label, value, sub) {
        return `<div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5">
            <div class="flex items-center gap-2 text-sm text-slate-500">
                <span class="w-8 h-8 rounded-lg flex items-center justify-center ${color}"><span class="material-symbols-outlined" style="font-size:18px">${icon}</span></span>${label}
            </div>
            <p class="mt-3 text-xl sm:text-2xl font-bold text-slate-900">${value}</p>
            <p class="text-xs text-slate-500 mt-1">${sub}</p>
        </div>`;
    }

    async function loadChart(days) {
        document.querySelectorAll('[data-days]').forEach(b => {
            const active = Number(b.dataset.days) === days;
            b.className = `px-3 py-1 rounded-md font-medium ${active ? 'bg-brand-700 text-white' : 'text-slate-600'}`;
        });
        const data = await App.api(`/stats/daily?jours=${days}`);
        const max = Math.max(...data.map(d => d.chiffre_affaires), 1);
        const total = data.reduce((s, d) => s + d.chiffre_affaires, 0);
        document.getElementById('chart-total').textContent = `${App.fcfa(total)} sur ${days} jours`;

        document.getElementById('chart').innerHTML = data.map(d => {
            const h = Math.max((d.chiffre_affaires / max) * 100, d.chiffre_affaires ? 3 : 1);
            return `<div class="flex-1 h-full flex items-end group relative">
                <div class="w-full rounded-t-md bg-brand-500/80 group-hover:bg-brand-700 transition-colors" style="height:${h}%"></div>
                <div class="hidden group-hover:block absolute bottom-full left-1/2 -translate-x-1/2 mb-2 whitespace-nowrap rounded-lg bg-slate-900 text-white text-xs px-2 py-1 z-10">
                    ${App.date(d.jour)} · ${App.fcfa(d.chiffre_affaires)} · ${d.nb_ventes} vente(s)
                </div>
            </div>`;
        }).join('');

        const step = days > 10 ? 5 : 1;
        document.getElementById('chart-labels').innerHTML = data.map((d, i) =>
            `<span class="flex-1 text-center">${i % step === 0 || i === data.length - 1 ? d.jour.slice(8, 10) + '/' + d.jour.slice(5, 7) : ''}</span>`).join('');
    }

    App.ready(async () => {
        const hour = new Date().getHours();
        const name = (App.user.nom_complet || App.user.username).split(' ')[0];
        document.getElementById('greeting').textContent = `${hour < 18 ? 'Bonjour' : 'Bonsoir'}, ${name}`;
        document.getElementById('today-label').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        const [stats, sales, top, lowStock, expiring] = await Promise.all([
            App.api('/stats'),
            App.api('/sales?limit=6'),
            App.api('/stats/top-products?jours=30&limit=5'),
            App.api('/products?alerte=stock'),
            App.api('/products?alerte=expiration')
        ]);

        const diff = stats.yesterday_revenue ? Math.round((stats.today_revenue - stats.yesterday_revenue) / stats.yesterday_revenue * 100) : null;
        document.getElementById('kpis').innerHTML = [
            kpi('payments', 'bg-emerald-50 text-emerald-700', "Aujourd'hui", App.fcfa(stats.today_revenue),
                `${stats.today_sales} vente(s)${diff !== null ? ` · ${diff >= 0 ? '+' : ''}${diff} % vs hier` : ''}`),
            kpi('calendar_month', 'bg-sky-50 text-sky-700', 'Ce mois-ci', App.fcfa(stats.month_revenue), `${App.number(stats.total_sales)} ventes au total`),
            kpi('inventory_2', 'bg-amber-50 text-amber-700', 'Produits', App.number(stats.total_products),
                `${stats.low_stock} en stock faible · ${stats.out_of_stock} en rupture`),
            kpi('event_busy', 'bg-red-50 text-red-700', 'Péremption', App.number(stats.expired_products + stats.expiring_soon),
                `${stats.expired_products} expiré(s) · ${stats.expiring_soon} sous ${stats.expiry_warning_days} j`)
        ].join('');

        // Alertes : ruptures d'abord, puis produits expirés / bientôt expirés
        const alerts = [
            ...lowStock.map(p => ({ p, type: p.stock === 0 ? 'rupture' : 'faible' })),
            ...expiring.map(p => ({ p, type: p.expire ? 'expire' : 'bientot' }))
        ].sort((a, b) => ['rupture', 'expire', 'faible', 'bientot'].indexOf(a.type) - ['rupture', 'expire', 'faible', 'bientot'].indexOf(b.type));
        const labels = {
            rupture: ['Rupture', 'red'], faible: ['Stock faible', 'amber'],
            expire: ['Expiré', 'red'], bientot: ['Expire bientôt', 'amber']
        };
        document.getElementById('alerts').innerHTML = alerts.length ? alerts.slice(0, 7).map(({ p, type }) => `
            <li class="flex items-center justify-between gap-3 rounded-lg px-3 py-2 bg-slate-50">
                <div class="min-w-0">
                    <p class="text-sm font-medium text-slate-800 truncate">${App.esc(p.nom)}</p>
                    <p class="text-xs text-slate-500">${type === 'expire' || type === 'bientot' ? 'Expire le ' + App.date(p.date_expiration) : `Stock : ${p.stock} / min. ${p.stock_min}`}</p>
                </div>
                ${App.badge(...labels[type])}
            </li>`).join('')
            : '<li class="text-sm text-slate-500 py-6 text-center">Aucune alerte, tout est en ordre ✓</li>';

        document.getElementById('recent-sales').innerHTML = sales.length ? sales.map(s => `
            <tr class="hover:bg-slate-50 cursor-pointer" onclick="location.href='ventes.html?id=${s.id}'">
                <td class="px-5 py-3 font-medium">#${s.id}</td>
                <td class="px-5 py-3 text-slate-500">${App.datetime(s.date)}</td>
                <td class="px-5 py-3">${App.esc(s.client_nom || 'Client de passage')}</td>
                <td class="px-5 py-3">${App.esc(App.PAYMENT_LABELS[s.mode_paiement] || s.mode_paiement)}</td>
                <td class="px-5 py-3 text-right font-semibold ${s.statut === 'annulee' ? 'line-through text-slate-400' : ''}">${App.fcfa(s.total)}</td>
            </tr>`).join('') : App.emptyRow(5, 'Aucune vente pour le moment.');

        const topMax = Math.max(...top.map(t => Number(t.quantite)), 1);
        document.getElementById('top-products').innerHTML = top.length ? top.map((t, i) => `
            <li>
                <div class="flex justify-between gap-2 text-sm"><span class="font-medium truncate">${i + 1}. ${App.esc(t.nom)}</span><span class="text-slate-500 whitespace-nowrap">${App.number(t.quantite)} vendus</span></div>
                <div class="h-2 bg-slate-100 rounded-full mt-1.5 overflow-hidden"><div class="h-full bg-brand-500 rounded-full" style="width:${Number(t.quantite) / topMax * 100}%"></div></div>
            </li>`).join('') : '<li class="text-sm text-slate-500 py-6 text-center">Pas encore de ventes sur la période.</li>';

        document.querySelectorAll('[data-days]').forEach(b => b.addEventListener('click', () => loadChart(Number(b.dataset.days)).catch(e => App.toast(e.message, 'error'))));
        await loadChart(7);
    });
</script>
</body>
</html>
