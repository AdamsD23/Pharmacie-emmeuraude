<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.style.opacity = '0.5';
            } else {
                input.type = 'password';
                icon.style.opacity = '1';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            const username = document.getElementById('email')?.value.trim();
            const password = document.getElementById('password')?.value;

            btn.disabled = true;
            btn.innerHTML = '<span>Connexion...</span>';

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('pharmacie_token', result.token);
                    localStorage.setItem('pharmacie_user', JSON.stringify(result.user));
                    window.location.href = 'tableaudebordpharmacy.html';
                } else {
                    alert('Identifiants invalides. Utilisez admin / admin123');
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('Erreur de connexion au serveur');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }
    </script>
